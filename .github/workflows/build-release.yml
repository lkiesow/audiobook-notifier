name: Create new release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # The RPM pins the image tag, which is the git tag, so a stale
      # __version__ would ship a package that lies about what it runs.
      - name: Check version matches tag
        run: >
          grep -qx '__version__ = "${{ github.ref_name }}"'
          audiobook_notifier/__init__.py

      - name: Build RPM
        run: >
          docker run
          -v .:/rpmbuild
          quay.io/centos/centos:stream10
          /rpmbuild/.rpm/build-rpm.sh
          "${{ github.ref_name }}"

      - run: file audiobook-notifier*

      - name: create new release
        uses: softprops/action-gh-release@v3
        with:
          files: audiobook-notifier*
          fail_on_unmatched_files: true
          generate_release_notes: true
