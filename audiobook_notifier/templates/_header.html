<h1>
  <img src="/icon.png" alt="" height="32" style="border-radius:4px;flex-shrink:0">
  Audiobook Notifier
  <span class="header-actions">
    {% if push_enabled %}<button type="button" id="push-toggle" class="icon-button" hidden>
      <svg class="bell-off" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160Zm320-300Zm0 420q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80ZM320-280h320v-280q0-66-47-113t-113-47q-66 0-113 47t-47 113v280Z"/>
      </svg>
      <svg class="bell-on" xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960">
        <path d="M160-200v-80h80v-280q0-83 50-147.5T420-792v-28q0-25 17.5-42.5T480-880q25 0 42.5 17.5T540-820v28q80 20 130 84.5T720-560v280h80v80H160ZM480-80q-33 0-56.5-23.5T400-160h160q0 33-23.5 56.5T480-80Z"/>
      </svg>
    </button>{% endif %}
    {% if auth_enabled %}<a href="/logout" class="signout" title="Sign out">
      <svg xmlns="http://www.w3.org/2000/svg"
           viewBox="0 -960 960 960">
        <path d="M200-120q-33 0-56.5-23.5T120-200v-560q0-33 23.5-56.5T200-840h280v80H200v560h280v80H200Zm440-160-55-58 102-102H360v-80h327L585-622l55-58 200 200-200 200Z"/>
      </svg>
    </a>{% endif %}
  </span>
</h1>

<nav class="tabs">
  <a href="/"{% if active_tab == 'overview' %} class="active"{% endif %}>Overview</a>
  <a href="/backlog"{% if active_tab == 'backlog' %} class="active"{% endif %}>Backlog</a>
  <a href="/add"{% if active_tab == 'add' %} class="active"{% endif %}>Add series</a>
</nav>
