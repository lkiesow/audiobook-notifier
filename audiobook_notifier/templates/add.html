<!doctype html>
<html lang="en">
<head>
  {% include "_head.html" %}
  <title>Add series · Audiobook Notifier</title>
</head>
<body>
  <main>
    {% include "_header.html" %}

    <section id="add-section" class="panel">
      <h2>Track a new series</h2>
      <form id="add-form">
        <input
          type="url"
          id="url-input"
          placeholder="https://www.audible.de/series/…"
          required
        >
        <button type="submit">Add</button>
      </form>
      <div id="add-error"></div>
    </section>
  </main>

  <script src="/common.js"></script>
  <script src="/add.js"></script>
</body>
</html>
