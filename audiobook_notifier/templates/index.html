<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Audiobook Notifier</title>
  <link rel="stylesheet" href="/style.css">
  <link rel="icon" href="/icon.png" type="image/png">
  <style>
    #series-container { display: flex; flex-direction: column; gap: 1rem; }

    .series-card {
      background: var(--bg-card);
      border: 1px solid var(--border-card);
      border-radius: 6px;
      overflow: visible;
		border-left: 5px solid var(--border-card);
    }

    .series-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.75rem 1rem;
      cursor: pointer;
      user-select: none;
      border-radius: 6px 6px 0 0;
    }
    .series-header:hover { background: var(--bg-hover); }

    .series-title-wrap { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0.15rem; }
    .series-title { font-weight: 600; font-size: 0.95rem; }
    .series-title.pending { color: var(--color-muted); font-style: italic; }

    .series-meta { font-size: 0.78rem; color: var(--color-meta); }

    .books-container { display: none; border-top: 1px solid var(--border-divider); overflow-x: auto; }
    .books-container.open { display: block; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: 0.45rem 0.75rem; border-bottom: 1px solid var(--border-divider); }
    th { background: var(--bg-th); font-weight: 600; color: var(--color-th); }
    tr:last-child td { border-bottom: none; }

    .cover-stack { display: flex; align-items: center; flex-shrink: 0; }
    .stack-thumb { position: relative; width: 36px; height: 36px; object-fit: cover; border-radius: 3px; border: 2px solid var(--bg-card); }
    .stack-thumb + .stack-thumb { margin-left: -16px; }

    .col-cover { width: 52px; padding-right: 4px; }
    .cover-thumb { display: block; width: 40px; height: 40px; object-fit: cover; border-radius: 3px; }

    #series-heading { display: flex; align-items: baseline; gap: 1rem; margin-bottom: 0.75rem; padding: 0 2px; }
    #series-heading h2 { font-size: 1rem; }
    #series-stats { font-size: 0.78rem; color: var(--color-meta); margin-left: auto; }

    #loading { color: var(--color-muted); font-size: 0.9rem; }

    @media (max-width: 560px) {
      .col-narrator, .col-language, .col-duration { display: none; }
      .stack-thumb + .stack-thumb { margin-left: -24px; }

      .books-container { overflow-x: visible; }
      table, thead, tbody { display: block; }
      thead { display: none; }
      tbody { display: flex; flex-direction: column; gap: 0.6rem; padding: 0.75rem; }
      tr {
        position: relative;
        display: block;
        min-height: 3.75rem;
        padding: 0.6rem 0.75rem 0.6rem calc(0.75rem + 40px + 0.6rem);
        border: 1px solid var(--border-card);
        border-radius: 6px;
      }
      td { display: block; border-bottom: none; padding: 0; }
      td.col-cover { position: absolute; left: 0.75rem; top: 0.6rem; width: 40px; }
      td.col-title { font-weight: 600; font-size: 0.9rem; margin-bottom: 0.15rem; }
      td.col-author {
        display: inline-block;
        max-width: 60%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        vertical-align: bottom;
        color: var(--color-meta);
        font-size: 0.78rem;
      }
      td.col-release {
        display: inline-block;
        color: var(--color-meta);
        font-size: 0.78rem;
        white-space: nowrap;
        vertical-align: bottom;
      }
      td.col-release::before { content: "· "; }
    }
  </style>
</head>
<body>
  <main>
    {% include "_header.html" %}

    <section id="today-section" class="panel" style="display:none">
      <h2>Out today</h2>
      <ul id="today-list" class="book-list"></ul>
    </section>

    <section id="upcoming-section" class="panel" style="display:none">
      <h2>Upcoming releases</h2>
      <ul id="upcoming-list" class="book-list"></ul>
    </section>

    <div id="series-heading" style="display:none">
      <h2>Tracked series</h2>
      <span id="series-stats"></span>
    </div>
    <div id="loading">Loading…</div>
    <div id="series-container"></div>
  </main>

  <script src="/common.js"></script>
  <script src="/app.js"></script>
</body>
</html>
